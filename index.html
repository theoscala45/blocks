<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0}

/* Layout: one phone screen. Letter badge on top, four period rows, day stepper at the bottom. */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --fg:#14171f; --muted:#5f6675; --line:#e2e5ec;
  --red:#c42e3f; --blue:#2a64a8; --free:#8a909c;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#181c25; --fg:#eef0f4; --muted:#9aa1ae; --line:#2a303c;
  --red:#e8566a; --blue:#5b93d6; --free:#7d8492; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#181c25; --fg:#eef0f4; --muted:#9aa1ae; --line:#2a303c;
  --red:#e8566a; --blue:#5b93d6; --free:#7d8492; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:22px;
  padding-block:28px 24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
header{display:flex;align-items:center;gap:16px}
.badge{flex:none;width:84px;height:84px;border-radius:20px;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:58px;line-height:1;color:#fff;background:var(--red)}
.badge.blue{background:var(--blue)}
.badge.none{background:var(--line);color:var(--muted);font-size:34px}
.when{display:flex;flex-direction:column;gap:2px;min-width:0}
.tag{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.date{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;text-wrap:balance}
.dayname{font-size:15px;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px}
.p{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.cls{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.2;min-width:0}
.blk{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
li.free .cls{color:var(--free);font-weight:600}
li.free{background:transparent;border-style:dashed}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;line-height:1.5;color:var(--muted)}
nav{margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
button{font:inherit;font-weight:600;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#today{color:var(--blue)}
#today[hidden]{display:block!important;visibility:hidden}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
</style>
</head>

  <ol id="list"></ol>
  <nav>

  </nav>

const OFF = new Set(["2026-09-07","2026-09-25","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16",
  "2026-11-02","2026-11-20","2026-11-26","2026-11-27"]);
const START = "2026-08-06", END = "2026-12-15";

const key = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); };

// Build the list of school days with letters (Aug 6 = A; checked against Oct 19 = F)
const DAYS = [];
for (let d = fromKey(START); key(d) <= END; d.setDate(d.getDate()+1)) {
  const w = d.getDay(), k = key(d);
  if (w > 0 && w < 6 && !OFF.has(k)) DAYS.push({ k, letter: LETTERS[DAYS.length % 8] });
}

let todayKey = key(new Date());
function defaultIndex(){
  const i = DAYS.findIndex(x => x.k >= todayKey);
  return i === -1 ? DAYS.length : i; // DAYS.length = past the end
}
let idx = defaultIndex();

const $ = id => document.getElementById(id);
const fmt = (k, o) => fromKey(k).toLocaleDateString("en-US", o);

function render(){
  const list = $("list"); list.innerHTML = "";
  if (idx >= DAYS.length) {
    $("badge").textContent = "–"; $("badge").className = "badge none";
    $("tag").textContent = "Semester over";
    $("date").textContent = "No more school days loaded";
    list.innerHTML = '<div class="msg">This schedule runs through Tuesday, Dec 15. Ask Claude to add the spring semester once you know which letter January 27 starts on.</div>';
  } else {
    const day = DAYS[idx];
    $("badge").textContent = day.letter;
    $("badge").className = "badge" + (LETTERS.indexOf(day.letter) % 2 ? " blue" : "");
    let tag;
    if (day.k === todayKey) tag = "Today";
    else if (idx === defaultIndex() && day.k > todayKey) tag = "No school today · next school day";
    else tag = day.k < todayKey ? "Past day" : "Upcoming";
    $("tag").textContent = tag;
    $("date").textContent = fmt(day.k, {weekday:"long", month:"short", day:"numeric"});
    ROTATION[day.letter].forEach((b, i) => {
      const li = document.createElement("li");
      if (b === 1) li.className = "free";
      li.innerHTML = `<span class="p">P${i+1}</span><span class="cls">${CLASSES[b]}</span><span class="blk">Block ${b}</span>`;
      list.appendChild(li);
    });
  }
  $("prev").disabled = idx <= 0;
  $("next").disabled = idx >= DAYS.length - 1;
  $("today").hidden = idx === defaultIndex();
}
$("prev").onclick = () => { if (idx > 0) { idx = Math.min(idx, DAYS.length) - 1; render(); } };
$("next").onclick = () => { if (idx < DAYS.length - 1) { idx++; render(); } };
$("today").onclick = () => { idx = defaultIndex(); render(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) { todayKey = key(new Date()); idx = defaultIndex(); render(); } });
render();
</script>
</body>
</html>
